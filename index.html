<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Launchpad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1a17'/%3E%3Crect x='8' y='8' width='7' height='7' rx='2' fill='%234fd1b0'/%3E%3Crect x='17' y='8' width='7' height='7' rx='2' fill='%23fff'/%3E%3Crect x='8' y='17' width='7' height='7' rx='2' fill='%23fff'/%3E%3Crect x='17' y='17' width='7' height='7' rx='2' fill='%237aa7ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<script src="sites.js"></script>
<script src="hidden.js"></script>
<script src="shared.js"></script>
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow" id="greeting"></p>
      <h1 id="title">Launchpad</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="lockbox">
      <button type="button" class="reveal" id="reveal" aria-controls="passbox" aria-expanded="false"></button>
      <form class="passbox" id="passbox" hidden>
        <input id="passcode" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="current-password">
        <button type="submit" class="passgo" id="passgo" aria-label="Unlock"></button>
        <p class="pass-error" id="pass-error" role="alert"></p>
      </form>
    </div>
  </header>
  <ul class="grid" id="grid"></ul>
  <noscript><p class="sub">This page needs JavaScript to show its links.</p></noscript>
</main>

<script>
const cfg = Object.assign({ title: "Launchpad", subtitle: "", newTab: true, sites: [] }, window.DASHBOARD);
const $ = (id) => document.getElementById(id);
let hiddenSites = []; // filled in once the passcode is entered

document.title = cfg.title;
$("title").textContent = cfg.title;
$("subtitle").textContent = cfg.subtitle;
$("passgo").innerHTML = icon("arrow-right");

const now = new Date();
const hour = now.getHours();
$("greeting").textContent =
  (hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening") + " · " +
  now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

function shortUrl(url) {
  try {
    const u = new URL(url, location.href);
    return (u.host + u.pathname).replace(/\/$/, "");
  } catch {
    return url;
  }
}

function cardFor(site) {
  const card = document.createElement("a");
  const color = site.color || ICON_COLORS[site.icon] || "slate";
  card.className = "card";
  card.href = site.url;
  if (cfg.newTab) {
    card.target = "_blank";
    card.rel = "noopener";
  }
  card.style.setProperty("--c1", `var(--${color}-1)`);
  card.style.setProperty("--c2", `var(--${color}-2)`);
  card.innerHTML = `
    <span class="icon">${icon(site.icon)}</span>
    ${site.hidden ? `<span class="badge">${icon("unlock")}Hidden</span>` : ""}
    <span><span class="name"></span><span class="desc"></span></span>
    <span class="foot"><span class="path"></span><span class="go">${icon("arrow")}</span></span>`;
  card.querySelector(".name").textContent = site.name;
  card.querySelector(".desc").textContent = site.description || "";
  card.querySelector(".path").textContent = shortUrl(site.url);
  return card;
}

function render() {
  const shown = [...cfg.sites, ...hiddenSites];
  $("grid").replaceChildren(...shown.map((site, i) => {
    const li = document.createElement("li");
    li.style.setProperty("--i", i);
    li.append(cardFor(site));
    return li;
  }));

  const unlocked = hiddenSites.length > 0;
  const reveal = $("reveal");
  reveal.innerHTML = icon(unlocked ? "unlock" : "lock");
  reveal.classList.toggle("on", unlocked);
  reveal.title = unlocked ? "Hide hidden sites" : "Show hidden sites";
  reveal.setAttribute("aria-label", reveal.title);
}

function setPassbox(open) {
  $("passbox").hidden = !open;
  $("reveal").setAttribute("aria-expanded", String(open));
  $("pass-error").textContent = "";
  $("passcode").value = "";
  if (open) $("passcode").focus();
}

$("reveal").addEventListener("click", () => {
  if (hiddenSites.length) {
    // Hiding forgets them, so showing them again needs the passcode.
    hiddenSites = [];
    render();
  } else {
    setPassbox($("passbox").hidden);
  }
});

$("passbox").addEventListener("submit", async (e) => {
  e.preventDefault();
  const passcode = $("passcode").value;
  if (!passcode) return;

  $("passgo").disabled = true;
  const json = window.HIDDEN_SITES
    ? await Vault.unlock(window.HIDDEN_SITES, passcode).catch(() => null)
    : null;
  $("passgo").disabled = false;

  if (!json) {
    $("pass-error").textContent = "Wrong passcode";
    const box = $("passbox");
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
    $("passcode").select();
    return;
  }

  hiddenSites = JSON.parse(json).map((site) => ({ ...site, hidden: true }));
  setPassbox(false);
  render();
});

// Close the passcode box on Escape or a click elsewhere.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("passbox").hidden) {
    setPassbox(false);
    $("reveal").focus();
  }
});
document.addEventListener("click", (e) => {
  if (!$("passbox").hidden && !e.target.closest(".lockbox")) setPassbox(false);
});

render();
</script>
</body>
</html>
